[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memorylineage-langgraph"
version = "0.1.0"
description = "Experimental fail-closed recovery gate for LangGraph checkpoints"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph==1.2.12",
  "langgraph-checkpoint-sqlite==3.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
