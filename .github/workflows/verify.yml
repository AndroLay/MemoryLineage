name: Verify MemoryLineage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Add browser target
        run: rustup target add wasm32-unknown-unknown
      - name: Install pinned Dioxus CLI
        run: cargo install dioxus-cli --version 0.8.0-alpha.1 --locked
      - name: Verify Rust workspace
        run: cargo xtask verify
      - name: Build static Dioxus Inspector
        run: cargo xtask build-web
      - name: Smoke-test Inspector routes and evidence flows
        run: cargo xtask smoke-web
      - name: Smoke-test supported Dioxus development server
        run: cargo xtask smoke-dev-web
      - name: Check tracked release boundary
        run: bash scripts/check-public-package.sh --release
      - name: Reproduce from transportable reviewer archive
        run: cargo xtask reviewer-reproduce
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository verification
        run: npm run verify
