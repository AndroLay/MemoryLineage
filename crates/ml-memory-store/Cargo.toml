[package]
name = "ml-memory-store"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic private SQLite memory snapshots for MemoryLineage"

[dependencies]
ml-core = { path = "../ml-core" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
