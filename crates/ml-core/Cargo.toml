[package]
name = "ml-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reference deterministic MemoryLineage commitment and lineage rules."

[dependencies]
hex = "0.4.3"
ml-spec-types = { path = "../ml-spec-types" }
thiserror = "2.0.17"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
